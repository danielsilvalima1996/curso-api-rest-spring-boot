cors:
  originPatterns: http://localhost:8080,http://localhost:3000,https://www.erudio.com.br
file:
  upload-dir: /home/daniel/Documentos/cursos/curso-api-rest-spring-boot/projetos/rest-with-spring-boot-and-java-session-21_Upload_Download_Arquivos/uploadDir
spring:
  application:
    name: rest-with-spring-boot-and-java
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rest_with_spring_boot_udemy?useTimezone=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
      show-sql: false
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 20MB
      max-request-size: 215MB
logging:
  level:
    root: info
#    br.com.daniel: debug
springdoc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true